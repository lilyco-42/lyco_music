name: Release

# 打 tag 或手动触发时，构建全平台安装包并发布到 GitHub Release。
# 产物：Windows msi/exe、macOS dmg、Android apk、iOS ipa、Linux AppImage。
on:
  push:
    tags: ['v*']
    # Automatically release only on root-version changes merged to main.
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  windows:
    name: Windows (msi / exe)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build
      - name: Build renderer
        run: pnpm --filter @lxmn/app-desktop build
      - name: Verify Electron bundled asset paths
        run: node scripts/check-desktop-assets.mjs
      # msi 需要 WiX，windows runner 自带；产出 .msi 供企业/静默安装场景。
      - name: Package (nsis + msi + portable)
        working-directory: apps/desktop
        run: pnpm exec electron-builder --win nsis msi portable --publish never
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.msi
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: warn
          retention-days: 14

  macos:
    name: macOS (dmg)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build
      - name: Build renderer
        run: pnpm --filter @lxmn/app-desktop build
      - name: Verify Electron bundled asset paths
        run: node scripts/check-desktop-assets.mjs
      # electron-builder 打包 dmg 时要挂载卷再卸载；macOS runner 上 Spotlight
      # 会索引刚挂载的卷，导致 hdiutil detach 以 'Resource busy' 反复失败。
      # 关掉索引即可，这也是 electron-builder 官方 issue 里给出的办法。
      - name: Disable Spotlight indexing
        run: sudo mdutil -a -i off

      - name: Package (dmg x64 + arm64, unsigned)
        working-directory: apps/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac dmg --x64 --arm64 --publish never
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
          if-no-files-found: warn
          retention-days: 14

  linux:
    name: Linux (AppImage)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build
      - name: Build renderer
        run: pnpm --filter @lxmn/app-desktop build
      - name: Verify Electron bundled asset paths
        run: node scripts/check-desktop-assets.mjs
      - name: Package (AppImage)
        working-directory: apps/desktop
        run: pnpm exec electron-builder --linux AppImage --publish never
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-linux
          path: |
            apps/desktop/release/*.AppImage
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android (apk)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # 不用 android-actions/setup-android：它内部的 sdkmanager 在 runner 的
      # Node 24 下会以 'Failed to find package tools' 退出。ubuntu runner 已预装
      # Android SDK（ANDROID_HOME=/usr/local/lib/android/sdk），直接用即可。
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}" >> $GITHUB_ENV
          ls ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}/platforms || true
          ls ${{ env.ANDROID_HOME || '/usr/local/lib/android/sdk' }}/build-tools || true
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build
      - name: Prepare Android project
        working-directory: apps/mobile
        shell: bash
        run: |
          # 仓库里 gradle.properties 已经设好 newArchEnabled=false 与 arm64/armeabi-v7a，
          # 这里只做两件必须的事：赋予 gradlew 执行位、打印生效配置便于排查。
          chmod +x android/gradlew
          grep -E '^(newArchEnabled|reactNativeArchitectures|org.gradle.jvmargs)' android/gradle.properties || true
      # 正式签名密钥从 secret 里还原成文件。
      #
      # 为什么存 base64 而不是直接存 .p12：secret 里放二进制不可靠（换行/编码
      # 都可能被改坏），base64 是纯 ASCII，能原样往返。
      #
      # 为什么必须用正式密钥：仓库里 android/app/debug.keystore 是公开的，
      # 用 debug 签名发版等于把「谁能签出被系统认可为同一应用的包」交给所有人 ——
      # 任何人拿这个公开密钥都能签出 Android 认作合法升级的 APK。
      #
      # 没有 secret 时（比如 fork 仓库）不报错，而是明确回退到 debug 签名，
      # 保证产物仍可侧载安装，同时在日志里留下显著警告。
      - name: Restore release keystore
        id: keystore
        shell: bash
        env:
          KS_B64: ${{ secrets.LXMN_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "::warning::LXMN_KEYSTORE_BASE64 未设置，本次 APK 将使用公开的 debug 密钥签名，不可用于正式分发。"
            echo "signed=debug" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/lxmn-release.p12"
          echo "keystore bytes: $(wc -c < "$RUNNER_TEMP/lxmn-release.p12")"
          # 确认真的解出了 PKCS12：文件头必须是 0x30 开头的 ASN.1 SEQUENCE。
          # 只比对大小不够 —— 解出半截文件也会有大小时长。
          head -c 1 "$RUNNER_TEMP/lxmn-release.p12" | od -An -tx1 | grep -q '30' \
            || { echo "::error::keystore 解码后不是 PKCS12（首字节不是 0x30）"; exit 1; }
          echo "LXMN_KEYSTORE_PATH=$RUNNER_TEMP/lxmn-release.p12" >> "$GITHUB_ENV"
          echo "signed=release" >> "$GITHUB_OUTPUT"

      # 版本号只在根 package.json 维护一处，构建时注入 Android 清单。
      # versionCode 必须单调递增（major*1000000 + minor*1000 + patch），
      # 否则 Android 会拒绝安装「版本比已装包更低」的升级包。
      - name: Set Android version from root package
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -e "const [major,minor,patch] = require('./package.json').version.split('.').map(Number); console.log(major*1000000+minor*1000+patch)")
          echo "LXMN_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "LXMN_VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "Android version $VERSION (code $CODE)"
      # 先打一次 JS bundle：Metro 报错是一行明确信息，比 gradle 的
      # "Process 'command node' finished with non-zero exit value 1" 好查得多
      - name: Bundle mobile JS (fast fail)
        working-directory: apps/mobile
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --reset-cache

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          LXMN_KEYSTORE_PASSWORD: ${{ secrets.LXMN_KEYSTORE_PASSWORD }}
          LXMN_KEY_ALIAS: ${{ secrets.LXMN_KEY_ALIAS }}
          LXMN_KEY_PASSWORD: ${{ secrets.LXMN_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # 直接问 Android 构建工具「这个包是谁签的」，而不是相信上面的配置。
      # 签名回退是静默的，只有验签才能发现发出去的是 debug 包。
      - name: Verify APK signing
        shell: bash
        run: |
          set -e
          APK=$(find apps/mobile/android -name '*.apk' | head -n1)
          echo "checking $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          "$BT/apksigner" verify --print-certs --verbose "$APK" | grep -Ei 'Verified using|Signer #1 certificate DN|SHA-256 digest' || true
          if [ "${{ steps.keystore.outputs.signed }}" = "release" ]; then
            "$BT/apksigner" verify --print-certs "$APK" | grep -q 'CN=LX Music' \
              || { echo "::error::期望用正式密钥（CN=LX Music）签名，实际不是"; exit 1; }
            echo "APK 已用正式密钥签名"
          else
            echo "::warning::APK 是 debug 签名的"
          fi
      - name: Collect APK
        shell: bash
        run: |
          mkdir -p out
          # 统一命名：gradle 产出叫 app-release.apk，在 GitHub Release 里看不出是哪个
          # 项目/版本/架构，下载页也无法展示版本号，这里重命名成与 exe/msi/dmg 同一套规则。
          # 版本号从 package.json 读，不硬编码，改版本时只需改一处。
          VERSION=$(node -p "require('./package.json').version")
          find apps/mobile/android -name '*.apk' -exec cp {} out/ \;
          for f in out/*.apk; do
            [ -e "$f" ] || continue
            case "$f" in
              *-universal.apk) suffix=universal ;;
              *-arm64-v8a.apk) suffix=arm64-v8a ;;
              *-armeabi-v7a.apk) suffix=armeabi-v7a ;;
              *) suffix=universal ;;
            esac
            mv "$f" "out/Lyco.Music-${VERSION}-android-${suffix}.apk"
          done
          ls -la out
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-android
          path: out/*.apk
          if-no-files-found: warn
          retention-days: 14

  ios:
    name: iOS (unsigned ipa)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: |
          bundle install || true
          bundle exec pod install || pod install
      # react-native-track-player 的 podspec 声明 swift_version 4.2，编译出的 .o 会
      # autolink 到 libswiftCompatibility56（链接命令里就是 -lswiftCompatibility56）。
      # 这个 .a 确实存在，但只在 **工具链** 目录下：
      #   <Xcode>/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos/
      # 而 SDK 目录 <iPhoneOS.sdk>/usr/lib/swift/ 里只有 .tbd 桩。
      # 我们的 app target 是纯 Objective-C（AppDelegate.mm / main.m，没有任何 .swift），
      # Xcode 因此认为「这不是 Swift target」，不给链接器加工具链的 swift 搜索路径，
      # 于是 -lswiftCompatibility56 找不到实体，报 Undefined symbols。
      # 显式把工具链的 swift/iphoneos 目录加进 LIBRARY_SEARCH_PATHS 即可。
      # 同样把 package.json 的版本注入 Xcode 工程：Info.plist 用的是
      # $(MARKETING_VERSION)，不注入的话应用内版本会停在模板默认值（曾经是 1.0）。
      # macos runner 上是 BSD sed，-i 后面必须跟一个空字符串参数。
      - name: Inject version into Xcode project
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(node -e "const [major,minor,patch] = require('./package.json').version.split('.').map(Number); console.log(major*1000000+minor*1000+patch)")
          PBX=apps/mobile/ios/LycoMusic.xcodeproj/project.pbxproj
          sed -i '' -E "s/MARKETING_VERSION = [^;]+;/MARKETING_VERSION = $VERSION;/g" "$PBX"
          sed -i '' -E "s/CURRENT_PROJECT_VERSION = [^;]+;/CURRENT_PROJECT_VERSION = $CODE;/g" "$PBX"
          grep -n "MARKETING_VERSION\|CURRENT_PROJECT_VERSION" "$PBX"

      - name: Build unsigned .app
        working-directory: apps/mobile/ios
        run: |
          SWIFT_LIBS="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/iphoneos"
          echo "SWIFT_LIBS=$SWIFT_LIBS"
          ls -la "$SWIFT_LIBS/libswiftCompatibility56.a"
          xcodebuild -workspace LycoMusic.xcworkspace \
            -scheme LycoMusic -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            LIBRARY_SEARCH_PATHS="\$(inherited) $SWIFT_LIBS" \
            build
      - name: Package unsigned ipa
        working-directory: apps/mobile/ios
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/LycoMusic.app Payload/
          # 与 exe/msi/dmg/apk 统一命名，下载页才能显示版本号；
          # 该 ipa 未签名，文件名保留 unsigned 以免用户误以为可直接安装。
          VERSION=$(node -p "require('../../../package.json').version")
          zip -qry "../Lyco.Music-${VERSION}-ios-unsigned.ipa" Payload
          ls -la ../Lyco.Music-*.ipa
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyco-ios
          path: apps/mobile/Lyco.Music-*-ios-unsigned.ipa
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [windows, macos, linux, android, ios]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ '${{ github.ref_type }}' = 'tag' ]; then
            NAME='${{ github.ref_name }}'
          else
            NAME="v${VERSION}-$(date +%Y%m%d)"
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-all
      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p release-files
          find dist-all -type f -exec cp -n {} release-files/ \;
          ls -la release-files || true
      # 同一天重复发布时 tag 相同（v0.1.0-YYYYMMDD），而 action-gh-release
      # 在 tag 已存在时是**追加**资产而不是重建，上一轮的文件会残留
      # （实测残留了旧命名的 app-release.apk / LX-Music-unsigned.ipa，
      #   因为改名发生在 01:04 之后，旧的仍挂在同一个 release 上）。
      # 这里先删掉同名 release，保证每次发布的结果只含本轮产物。
      - name: Drop previous release with same tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG='${{ steps.tag.outputs.name }}'
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "deleting existing release $TAG (same-day rerun)"
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          else
            echo "no existing release for $TAG"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Lyco Music ${{ steps.tag.outputs.name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Lyco Music 全平台发布

            网易云音乐风格 UI 重制版，桌面端与移动端共用同一套内核（@lxmn/core）。

            ### 下载
            | 平台 | 文件 | 说明 |
            | --- | --- | --- |
            | Windows | `Lyco.Music-*-windows-setup.exe` / `*.msi` | 安装版（NSIS 向导 / MSI 静默） |
            | Windows 便携 | `Lyco.Music-*-windows-x64-portable.exe` | 免安装，双击即用 |
            | macOS | `Lyco.Music-*-macos-*.dmg` | 未签名，首次打开请右键 → 打开 |
            | Android | `Lyco.Music-*-android-*.apk` | 直接侧载安装 |
            | iOS | `Lyco.Music-*-ios-unsigned.ipa` | 未签名，需自行签名或用 AltStore 侧载 |
            | Linux | `Lyco.Music-*-linux-*.AppImage` | chmod +x 后直接运行 |

            ### 会员与音源订阅
            1. 打开 https://lain42.top/shop/ 用积分购买「音乐会员 · 年卡」（¥88/年）
            2. 在「我的账户」复制订阅链接
            3. 在客户端「会员」页粘贴链接并激活，即可一键补全全部第三方音源

            > 未签名安装包会被系统提示，这是正常的。
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 同步到 lain42.top 的软件下载目录，并生成 SHA256SUMS
      # 未配置 LAIN42_SSH_KEY 时自动跳过，不影响 GitHub Release
      - name: Publish to lain42.top downloads
        # 这一步要 scp 约 640MB 到自建服务器，实测 20~40 分钟。
        # 但它是可选的镜像步骤，绝不能无限期挂着 —— 上面已经把
        # 「Create release」提到它前面，所以这里超时也不会影响 GitHub Release。
        timeout-minutes: 30
        shell: bash
        env:
          SSH_KEY: ${{ secrets.LAIN42_SSH_KEY }}
        run: |
          set -e
          if [ -z "$SSH_KEY" ]; then
            echo 'LAIN42_SSH_KEY 未配置，跳过同步到 lain42.top（不影响 GitHub Release）'
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_lain42
          chmod 600 ~/.ssh/id_lain42
          ssh-keyscan -H lain42.top >> ~/.ssh/known_hosts 2>/dev/null || true
          STAGE="lyco_music/${{ steps.tag.outputs.name }}"

          # 服务器只有 40G，每个版本约 640MB。v0.2.12 那次「Publish to lain42.top downloads」
          # 失败就是因为磁盘写满（100%）。这里先量剩余空间，不够就先删最旧的版本目录
          #（GitHub Release 与 R2 镜像仍然保留，历史版本不会丢）。
          KEEP=3
          FREE_KB=$(ssh -i ~/.ssh/id_lain42 root@lain42.top "df -P / | awk 'NR==2{print \$4}'")
          echo "lain42.top 可用空间: $((FREE_KB/1024)) MB"
          if [ "$FREE_KB" -lt 2097152 ]; then
            echo "可用空间不足 2GB，清理旧版本（保留最新 $KEEP 个）"
            ssh -i ~/.ssh/id_lain42 root@lain42.top "cd /var/www/studio/downloads/lyco_music && ls -1 | sort -V | head -n -$KEEP | xargs -r rm -rf; df -h / | tail -1"
          fi

          # 再确认一次；仍然不够就明确失败，而不是让 scp 半路断掉
          FREE_KB=$(ssh -i ~/.ssh/id_lain42 root@lain42.top "df -P / | awk 'NR==2{print \$4}'")
          if [ "$FREE_KB" -lt 1048576 ]; then
            echo "::error::lain42.top 可用空间不足 1GB（$((FREE_KB/1024)) MB），请先清理"; exit 1
          fi
          # 先清空再传：同一个 tag 重跑时，上一轮的文件会残留在目录里
          # （例如旧命名 app-release.apk），导致 SHA256SUMS 与下载页混入过期产物。
          ssh -i ~/.ssh/id_lain42 root@lain42.top "rm -rf /var/www/studio/downloads/$STAGE && mkdir -p /var/www/studio/downloads/$STAGE"
          for f in release-files/*; do
            [ -f "$f" ] || continue
            case "$f" in
              *.exe|*.msi|*.dmg|*.apk|*.ipa|*.AppImage|*.zip|*.blockmap|*.yml)
                scp -q -o ConnectTimeout=10 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \n                  -i ~/.ssh/id_lain42 "$f" "root@lain42.top:/var/www/studio/downloads/$STAGE/" ;;
            esac
          done
          ssh -i ~/.ssh/id_lain42 root@lain42.top \
            "cd /var/www/studio/downloads/$STAGE && sha256sum * > SHA256SUMS.txt && ls -la"

          # 把本次发布登记进下载页目录（幂等）。脚本随仓库走，避免依赖服务器上的临时文件。
          scp -i ~/.ssh/id_lain42 scripts/publish-downloads.py root@lain42.top:/tmp/publish-downloads.py
          ssh -i ~/.ssh/id_lain42 root@lain42.top \
            "python3 /tmp/publish-downloads.py '${{ steps.tag.outputs.name }}'"

      # 镜像到 Cloudflare R2。
      # 这里刻意不用 R2 的 S3 Access Key：那需要一个 R2 API Token，
      # 而 Cloudflare 的 OAuth 登录建不出 API Token（403）。所以反过来 ——
      # 由镜像 Worker 自己去 lain42.top 拉文件入桶，CI 只发几十字节的 JSON，
      # 几百 MB 的安装包在 Cloudflare 内部流转，也不撞 Worker 的请求体大小限制。
      # 未配置 R2_UPLOAD_TOKEN 时自动跳过，下载页主源仍是 lain42.top。
      - name: Mirror to Cloudflare R2
        # R2 只是边缘加速副本，主源是 lain42.top（已成功）。
        # v0.2.14 实测：镜像失败会把整个 job 判红，连带 GitHub Release 都不创建，
        # 于是一个「可选加速步骤」把正式发布也拖下水 —— 这里降级为非致命。
        #
        # v0.2.16 又踩一次：Worker 端不返回时，每个文件各自等 --max-time 900s，
        # 十几个文件排下来能挂一小时以上，job 一直 in_progress，
        # 后面的「Create release」永远轮不到（现象：GitHub Release 页面连续三个版本 404）。
        # 所以这里三重收口：单请求 120s、整步 12min、连续两个失败就放弃。
        continue-on-error: true
        timeout-minutes: 12
        shell: bash
        env:
          R2_UPLOAD_TOKEN: ${{ secrets.R2_UPLOAD_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_MIRROR_ENDPOINT }}
        run: |
          set -e
          if [ -z "$R2_UPLOAD_TOKEN" ]; then
            echo 'R2_UPLOAD_TOKEN 未配置，跳过镜像（下载页主源仍是 lain42.top）'
            exit 0
          fi
          EP="${R2_ENDPOINT:-https://lyco-music-dl.m15178682641.workers.dev}"
          STAGE="lyco_music/${{ steps.tag.outputs.name }}"
          SRC_BASE="https://lain42.top/downloads/$STAGE"
          echo "endpoint=$EP stage=$STAGE"
          ok=0
          fail=0
          mirror() {
            payload=$(printf '{"key":"%s","src":"%s"}' "$1" "$2")
            resp=$(curl -sS --connect-timeout 10 --max-time 120 -X POST "$EP/__mirror" \
              -H "Authorization: Bearer $R2_UPLOAD_TOKEN" \
              -H 'Content-Type: application/json' --data "$payload" || true)
            case "$resp" in
              *'"ok":true'*) ok=$((ok+1)); echo "  OK   $1" ;;
              *) fail=$((fail+1)); echo "  FAIL $1 -> ${resp:0:200}" ;;
            esac
          }
          for f in release-files/*; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            case "$name" in
              *.exe|*.msi|*.dmg|*.apk|*.ipa|*.AppImage|*.zip|*.blockmap|*.yml|SHA256SUMS.txt) ;;
              *) continue ;;
            esac
            mirror "$STAGE/$name" "$SRC_BASE/$name"
            # 连续失败说明 Worker 挂了/令牌错了，再排下去只是浪费时间
            if [ "$fail" -ge 2 ] && [ "$ok" -eq 0 ]; then
              echo '连续失败，放弃镜像（不影响 GitHub Release 与 lain42.top）'
              break
            fi
          done
          # 下载页本身也镜像：页面/样式/manifest 都走边缘（说明条由 Worker 注入）
          mirror "downloads/index.html" "https://lain42.top/downloads/"
          mirror "downloads/downloads.css" "https://lain42.top/downloads/downloads.css"
          mirror "downloads/manifest.json" "https://lain42.top/downloads/manifest.json"
          mirror "assets/studio.css" "https://lain42.top/assets/studio.css"
          mirror "assets/studio.js" "https://lain42.top/assets/studio.js"
          echo "R2 镜像：成功 $ok，失败 $fail"
          echo "https://lyco-music-dl.m15178682641.workers.dev/$STAGE/"
          [ "$fail" -eq 0 ] || exit 1
