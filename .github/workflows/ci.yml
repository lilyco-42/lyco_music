name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Packages (build, typecheck, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 不指定 version：由 package.json 的 packageManager 决定，避免版本冲突
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 先构建：pnpm -r 按拓扑顺序，@lxmn/core 会先于依赖它的包产出 dist
      - name: Build packages
        run: pnpm -r --filter './packages/**' build

      - name: Typecheck packages
        run: pnpm -r --filter './packages/**' typecheck

      - name: Run kernel tests
        run: pnpm test

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lyco-packages
          path: packages/*/dist
          if-no-files-found: warn
          retention-days: 7

  desktop:
    name: Desktop app (typecheck, build)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build

      - name: Typecheck desktop app
        run: pnpm --filter @lxmn/app-desktop typecheck

      - name: Build desktop app
        run: pnpm --filter @lxmn/app-desktop build

      - name: Verify Electron bundled asset paths
        run: node scripts/check-desktop-assets.mjs

      - name: Upload desktop dist
        uses: actions/upload-artifact@v4
        with:
          name: lyco-desktop-dist
          path: apps/desktop/dist
          if-no-files-found: error
          retention-days: 7

  mobile:
    name: Mobile app (typecheck)
    runs-on: ubuntu-latest
    needs: packages
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build workspace packages
        run: pnpm -r --filter './packages/**' build

      # 只做类型检查：真正的 apk/aab 由 release.yml 的 Android job 产出
      - name: Bundle mobile JS (fast fail)
        working-directory: apps/mobile
        run: npx react-native bundle --platform android --dev false --entry-file index.js --bundle-output /tmp/index.android.bundle --reset-cache

      - name: Test mobile app (jest + RTL, act)
        run: pnpm --filter @lxmn/app-mobile test -- --silent

      - name: Typecheck mobile app
        run: pnpm --filter @lxmn/app-mobile typecheck
