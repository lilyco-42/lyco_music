appId: top.lain42.lycomusic
productName: Lyco Music
copyright: Copyright © 2026 lain42

# 关于文件名：显示名（productName）保留空格，但 **artifactName 一律用
# "Lyco.Music" 这个不带空格的字面量**，不要写成本名。
# 因为显示名带空格，直接内插会让产物名里出现空格，
# 空格在 URL 里必须转义成 %20；下载页的直链一旦被浏览器/下载器二次编码就会 404。
# 用点号代替空格，文件名全平台安全。

# 必须显式指定：本仓库用 node-linker=hoisted，electron 被提升到仓库根的
# node_modules，electron-builder 从 apps/desktop 向上探测不到，会报
# "Cannot compute electron version from installed node modules"。
# 指定后 electron-builder 直接按版本下载官方发行包。
electronVersion: 33.4.11

directories:
  output: release
  buildResources: build

# 关掉原生模块重建。
# 桌面端的 files 白名单里只有 dist / electron / package.json —— 产物里
# 一个 node_modules 都不带（渲染层用的是内核的纯 JS 实现，没有 native addon）。
# 但 electron-builder 默认仍会跑 @electron/rebuild，去 appDir/node_modules
# 里逐个 stat 依赖；本仓库用 hoisted 链接，依赖都在仓库根，
# 于是它找不到 apps/desktop/node_modules/@tailwindcss/vite 直接报 ENOENT。
npmRebuild: false

files:
  - dist/**/*
  - electron/**/*
  # 托盘图标必须进包：main.cjs 用 app.getAppPath()/build/icon.png 去读，
  # 少这一行 dev 正常、打包版托盘是个空白方块。
  - build/icon.png
  - package.json

# 不签名：Windows/macOS 安装包为未签名版本
# macOS 首次打开需右键 -> 打开；Windows 可能提示 SmartScreen
forceCodeSigning: false

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: msi
      arch: [x64]
    - target: portable
      arch: [x64]
  artifactName: Lyco.Music-${version}-windows-${arch}.${ext}

msi:
  oneClick: false
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lyco Music
  artifactName: Lyco.Music-${version}-windows-${arch}.msi

# portable 必须单独写 artifactName。
# 不写的话它会回退到 win.artifactName（LX.Music-<ver>-windows-<arch>.${ext}），
# 与上面的 msi 规则求值后**同名**，便携版 exe 会直接覆盖刚打好的 msi。
# 实测证据：服务器上 LX.Music-0.1.0-windows-x64.msi 的首字节是 4d5a（MZ，PE 可执行），
# 而真正的 MSI 是 OLE2 复合文档，必须以 d0cf11e0 开头。
# CI 日志也印证了：building target=portable file=release\LX.Music-0.1.0-windows-x64.msi
portable:
  artifactName: Lyco.Music-${version}-windows-${arch}-portable.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Lyco Music
  artifactName: Lyco.Music-${version}-windows-setup.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.music
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: Lyco.Music-${version}-macos-${arch}.${ext}
  # 没有开发者证书，交给 afterPack 钩子做 ad-hoc 签名。
  #
  # 这里必须显式写 null。不写的话 electron-builder 会走
  # findIdentity()，CI 的 keychain 是空的，返回 null，于是命中
  # "identity == null && !options.sign" 分支直接 return false ——
  # 也就是**完全不签名**，而不是「签成 ad-hoc」。未签名的 .app 在
  # Apple Silicon 上会被 Gatekeeper 拒绝执行，用户双击看到的是
  # 「已损坏，无法打开」。
  #
  # 注意也不能写 identity: '-'：那会被当成证书名字丢给
  # findIdentity() 去 keychain 里匹配，照样匹配不到。
  identity: null
  # 硬化运行时要求签名带 entitlements，ad-hoc 下反而会让 app 起不来。
  hardenedRuntime: false

# ad-hoc 签名的实际执行者。identity: null 让 electron-builder 跳过它自己的
# 签名流程，这里再补上 codesign --sign -，保证 bundle 完整性可校验。
afterPack: ./build/after-pack.cjs

dmg:
  # 必须带 ${arch}：x64 与 arm64 两个 DMG 是并发构建的，若卷名相同
  # （都叫 "LX Music 0.1.0"），第二个卷会挂成 "... 1"，
  # 随后 hdiutil detach 因卷名冲突以 exit 16 (resource busy) 失败，
  # dmgbuild 接着找不到 /Volumes/<name>/.background/background.tiff。
  # 卷名按架构区分即可根治。
  title: ${productName} ${version} ${arch}

linux:
  icon: build/icon.png
  category: Audio
  target:
    - target: AppImage
      arch: [x64]
  artifactName: Lyco.Music-${version}-linux-${arch}.${ext}